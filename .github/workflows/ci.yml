name: CI

on:
  push:
  pull_request:

jobs:
  audit:
    name: تدقيق ثابت (i18n + صياغة)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: audit.js
        run: node audit.js

  solver:
    name: اختبارات الحلّال التلقائي (الريشو)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tests/solver.test.mjs
        run: node tests/solver.test.mjs

  ui:
    name: اختبار الواجهة في متصفح حقيقي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: تثبيت الاعتمادات
        run: npm install
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium
      - name: tests/ui.test.mjs
        run: npm run test:ui

  rules:
    name: اختبارات قواعد Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # firebase-tools يتطلب Java 21 فأحدث
      - name: تثبيت الاعتمادات
        run: npm install
      - name: تشغيل اختبارات القواعد على المحاكي
        run: npm run test:rules
