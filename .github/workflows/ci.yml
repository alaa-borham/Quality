name: CI

on:
  push:
  pull_request:

jobs:
  audit:
    name: تدقيق ثابت (i18n + صياغة)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: audit.js
        run: node audit.js

  rules:
    name: اختبارات قواعد Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: تثبيت الاعتمادات
        run: npm install
      - name: تشغيل اختبارات القواعد على المحاكي
        run: npm run test:rules
